name: Build autoladd (Windows VST3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target autoladd_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse build/autoladd_artefacts/Release/VST3/autoladd.vst3 dist/autoladd.vst3
          Copy-Item Scripts/install-windows.bat dist/install-windows.bat

      - uses: actions/upload-artifact@v4
        with:
          name: autoladd-vst3-windows
          path: dist/
